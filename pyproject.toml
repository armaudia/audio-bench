[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-bench"
version = "0.1.0"
description = "Reproducible audio processing evaluation harness (evidence specification v0.1)"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.11",
  "soundfile>=0.12",
  "jsonschema>=4.20",
  "filelock>=3.12",
  "psutil>=5.9",
  "pystoi==0.4.1",
  "rfc8785==0.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pip-tools>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audio_bench = [
  "py.typed",
  "schema_data/*.json",
  "schema_data/*.schema.json",
  "schema_data/sdk/*.schema.json",
  "schema_data/sdk/canonical-vectors.json",
  "schema_data/sdk/providers/*.json",
  "report_assets/*",
  "runtime_data/manifests/synthetic/synthetic-16k-v1/*",
  "runtime_data/manifests/synthetic/synthetic-16k-v1/audio/*",
  "runtime_data/suites/synthetic-smoke-v1/*",
  "runtime_data/registry/*",
  "runtime_data/docs/task-evidence/artifacts/sdk-conformance/*",
  "runtime_data/schemas/sdk/providers/*",
  "runtime_data/deps/lock.json",
  "runtime_data/deps/sdk-snapshot/*",
  "runtime_data/toolchain-lock.json",
  "runtime_data/locks/*",
  "runtime_data/pyproject.toml",
  "runtime_data/native/CMakeLists.txt",
  "runtime_data/native/src/*.cpp",
  "runtime_data/native/src/*.hpp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "sdk: requires the installed audio-sdk package and its conformance executable",
  "corpus: requires rights-cleared corpus bytes",
  "isolation: requires disposable execution infrastructure",
]
filterwarnings = ["error"]
