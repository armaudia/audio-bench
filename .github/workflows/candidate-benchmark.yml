name: Candidate benchmark
on:
  push:
    branches: [main]
    paths:
      - 'submissions/*.json'
permissions:
  contents: read
concurrency:
  group: candidates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r locks/requirements-ci.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Check out the pinned audio-sdk build dependency
        id: sdk
        run: python -c 'import json,os; p=json.load(open("deps/sdk-source.json")); f=open(os.environ["GITHUB_OUTPUT"],"a"); print("revision="+p["revision"],file=f)'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: armaudia/audio-sdk
          ref: ${{ steps.sdk.outputs.revision }}
          path: sdk-source
          persist-credentials: false
      - run: python scripts/prepare_sdk.py --sdk-source sdk-source
      - name: Package pinned public providers without publishing permission
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p build
          mapfile -d '' -t changed_paths < <(git diff --name-only --diff-filter=ACMR -z "$BEFORE_SHA" "$HEAD_SHA" -- submissions)
          submissions=()
          for path in "${changed_paths[@]}"; do
            manifest="${path#submissions/}"
            if [[ "$manifest" == *.json && "$manifest" != */* ]]; then
              submissions+=("$path")
            fi
          done
          sdk_prefix="$(python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('deps/lock.json').read_text())
          dep=next(item for item in lock['dependencies'] if item['id']=='audio-sdk-installed-package')
          print(Path(dep['artifact']).resolve().parent / 'audio-sdk-0.1.0')
          PY
          )"
          python scripts/package_public_candidates.py --sdk-prefix "$sdk_prefix" --output build/candidate-packages "${submissions[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-bench-candidate-plugins
          path: build/candidate-packages
          if-no-files-found: error

  evaluate:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r locks/requirements-ci.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audio-bench-candidate-plugins
          path: build/candidate-packages
      - name: Detect real-corpus submissions
        id: corpus
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          found = any(json.loads(path.read_text()).get('benchmark', {}).get('dataset_id') == 'voicebank-demand-test-v1'
                      for path in Path('build/candidate-packages').glob('*/submission.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"voicebank={str(found).lower()}\n")
          PY
      - name: Verify VoiceBank evaluation rights
        if: steps.corpus.outputs.voicebank == 'true'
        run: python scripts/check_corpus_rights.py --dataset voicebank-demand --operation evaluation
      - name: Restore or initialize the VoiceBank corpus cache
        if: steps.corpus.outputs.voicebank == 'true'
        id: dataset-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/audio-bench-datasets
          key: audio-bench-corpus-voicebank-demand-${{ hashFiles('DATA_LICENSE.md', 'scripts/check_corpus_rights.py', 'scripts/prepare_voices_cohort.py', 'scripts/fetch_voicebank_demand.py', 'scripts/fetch_dns5_dev.py', 'src/audio_bench/acquire.py', 'manifests/voices/voices-balanced-realroom-v1/selection.json', 'manifests/voices/voices-balanced-realroom-v1/status.json', 'manifests/voicebank-demand/voicebank-demand-test-v1/provenance.json', 'manifests/voicebank.status.json', 'manifests/dns5.status.json') }}
      - name: Verify VoiceBank cache or download and verify its pinned cohort
        if: steps.corpus.outputs.voicebank == 'true'
        env:
          CACHE_ROOT: ${{ runner.temp }}/audio-bench-datasets
          CACHE_HIT: ${{ steps.dataset-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            python scripts/fetch_voicebank_demand.py --cache "$CACHE_ROOT" --offline
          else
            python scripts/fetch_voicebank_demand.py --cache "$CACHE_ROOT"
          fi
          python scripts/check_corpus_rights.py --dataset voicebank-demand --operation public-cache --cache-root "$CACHE_ROOT"
          python scripts/fetch_voicebank_demand.py --cache "$CACHE_ROOT" --offline
      - name: Check out the pinned audio-sdk build dependency
        id: sdk
        run: python -c 'import json,os; p=json.load(open("deps/sdk-source.json")); f=open(os.environ["GITHUB_OUTPUT"],"a"); print("revision="+p["revision"],file=f)'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: armaudia/audio-sdk
          ref: ${{ steps.sdk.outputs.revision }}
          path: sdk-source
          persist-credentials: false
      - run: python scripts/prepare_sdk.py --sdk-source sdk-source
      - name: Build the trusted benchmark harness
        run: |
          sdk_prefix="$(python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('deps/lock.json').read_text())
          dep=next(x for x in lock['dependencies'] if x['id']=='audio-sdk-installed-package')
          print(Path(dep['artifact']).resolve().parent / 'audio-sdk-0.1.0')
          PY
          )"
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release "-DAUDIO_SDK_PREFIX=$sdk_prefix"
          cmake --build build/native --parallel 2
      - name: Evaluate plugins without publishing credentials
        run: |
          python -m pip install --no-deps --no-build-isolation -e .
          sdk_prefix="$(python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('deps/lock.json').read_text())
          dep=next(x for x in lock['dependencies'] if x['id']=='audio-sdk-installed-package')
          print(Path(dep['artifact']).resolve().parent / 'audio-sdk-0.1.0')
          PY
          )"
          python scripts/evaluate_public_candidates.py --packages build/candidate-packages \
            --sdk-prefix "$sdk_prefix" --native-build build/native --work build/candidate-work \
            --dataset-cache "${{ runner.temp }}/audio-bench-datasets" \
            --output build/ci/results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-bench-results
          path: build/ci/results.json
          if-no-files-found: error
