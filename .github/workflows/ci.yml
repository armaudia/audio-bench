name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Read immutable SDK source pin
        id: sdk
        run: python -c 'import json,os; p=json.load(open("deps/sdk-source.json")); f=open(os.environ["GITHUB_OUTPUT"],"a"); print("revision="+p["revision"],file=f)'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: armaudia/audio-sdk
          ref: ${{ steps.sdk.outputs.revision }}
          path: sdk-source
          persist-credentials: false
      - run: python -m pip install -r locks/requirements-ci.txt --report build-pip-install.json
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python scripts/prepare_sdk.py --sdk-source sdk-source
      - name: Build and run contract checks (no benchmark suite)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: python scripts/ci.py --skip-benchmarks
      - name: Build, test, and run synthetic suites (main merge only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/ci.py
      - name: Browser acceptance
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            python scripts/check_site_browser.py --results build/ci/results.json
            python scripts/check_report_browser.py build/ci/highpass-report
          else
            python scripts/check_site_browser.py
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-bench-${{ matrix.os }}
          path: build/ci/dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'Linux'
        with:
          name: audio-bench-results
          path: build/ci/results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: audio-bench-evidence-${{ matrix.os }}
          path: |
            build/ci/*.xml
            build/ci/*-results.json
            build-pip-install.json
            deps/lock.json
            toolchain-lock.json
          if-no-files-found: warn
  licensing:
    name: licensing-and-dco
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install 'reuse[charset-normalizer]==6.3.0'
      - run: reuse lint
      - run: mkdir -p build/license-evidence
      - run: reuse spdx -o build/license-evidence/audio-bench-source.spdx
      - name: Verify contribution intake
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: python scripts/check_contributors.py --policy bench --event "$EVENT_PATH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: audio-bench-licensing
          path: build/license-evidence/
          if-no-files-found: warn
  quality:
    name: quality
    if: always()
    needs: [build, licensing]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c 'import json,os; assert all(j["result"] == "success" for j in json.loads(os.environ["RESULTS"]).values())'
