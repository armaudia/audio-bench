name: Prepare corpus data
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: External corpus to prepare
        required: true
        default: voicebank-demand
        type: choice
        options:
          - voices
          - voicebank-demand
          - dns5
      use_public_actions_cache:
        description: Persist audio in the public GitHub Actions cache (requires explicit redistribution approval)
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: corpus-cache-${{ inputs.dataset }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r locks/requirements-ci.txt
      - name: Check evaluation approval
        env:
          DATASET: ${{ inputs.dataset }}
        run: python scripts/check_corpus_rights.py --dataset "$DATASET" --operation evaluation
      - name: Check public cache and redistribution approval
        if: inputs.use_public_actions_cache
        env:
          DATASET: ${{ inputs.dataset }}
        run: python scripts/check_corpus_rights.py --dataset "$DATASET" --operation public-cache
      - name: Restore or initialize the public dataset cache
        id: dataset-cache
        if: inputs.use_public_actions_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/audio-bench-datasets
          key: audio-bench-corpus-${{ inputs.dataset }}-${{ hashFiles('DATA_LICENSE.md', 'scripts/check_corpus_rights.py', 'scripts/prepare_voices_cohort.py', 'scripts/fetch_voicebank_demand.py', 'scripts/fetch_dns5_dev.py', 'src/audio_bench/acquire.py', 'manifests/voices/voices-balanced-realroom-v1/selection.json', 'manifests/voices/voices-balanced-realroom-v1/status.json', 'manifests/voicebank-demand/voicebank-demand-test-v1/provenance.json', 'manifests/voicebank.status.json', 'manifests/dns5.status.json') }}
      - name: Prepare VOiCES balanced test cohort
        if: inputs.dataset == 'voices'
        env:
          CACHE_ROOT: ${{ runner.temp }}/audio-bench-datasets
          CACHE_HIT: ${{ steps.dataset-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            python scripts/prepare_voices_cohort.py --cache "$CACHE_ROOT" --offline
          else
            python scripts/prepare_voices_cohort.py --cache "$CACHE_ROOT"
          fi
          OPERATION=evaluation
          if [ "${{ inputs.use_public_actions_cache }}" = "true" ]; then OPERATION=public-cache; fi
          python scripts/check_corpus_rights.py --dataset voices --operation "$OPERATION" --cache-root "$CACHE_ROOT"
      - name: Prepare VoiceBank+DEMAND paired cohort
        if: inputs.dataset == 'voicebank-demand'
        env:
          CACHE_ROOT: ${{ runner.temp }}/audio-bench-datasets
          CACHE_HIT: ${{ steps.dataset-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            python scripts/fetch_voicebank_demand.py --cache "$CACHE_ROOT" --offline
          else
            python scripts/fetch_voicebank_demand.py --cache "$CACHE_ROOT"
          fi
          OPERATION=evaluation
          if [ "${{ inputs.use_public_actions_cache }}" = "true" ]; then OPERATION=public-cache; fi
          python scripts/check_corpus_rights.py --dataset voicebank-demand --operation "$OPERATION" --cache-root "$CACHE_ROOT"
      - name: Prepare DNS5 speakerphone development cohort
        if: inputs.dataset == 'dns5'
        env:
          CACHE_ROOT: ${{ runner.temp }}/audio-bench-datasets
          CACHE_HIT: ${{ steps.dataset-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            python scripts/fetch_dns5_dev.py --cache "$CACHE_ROOT" --offline
          else
            python scripts/fetch_dns5_dev.py --cache "$CACHE_ROOT"
          fi
          OPERATION=evaluation
          if [ "${{ inputs.use_public_actions_cache }}" = "true" ]; then OPERATION=public-cache; fi
          python scripts/check_corpus_rights.py --dataset dns5 --operation "$OPERATION" --cache-root "$CACHE_ROOT"
      - name: Verify cache reuse without network
        env:
          DATASET: ${{ inputs.dataset }}
          CACHE_ROOT: ${{ runner.temp }}/audio-bench-datasets
        run: |
          case "$DATASET" in
            voices) python scripts/prepare_voices_cohort.py --cache "$CACHE_ROOT" --offline ;;
            voicebank-demand) python scripts/fetch_voicebank_demand.py --cache "$CACHE_ROOT" --offline ;;
            dns5) python scripts/fetch_dns5_dev.py --cache "$CACHE_ROOT" --offline ;;
          esac
      - name: Record preparation result
        run: |
          echo "Dataset: ${{ inputs.dataset }}; exact cache hit: ${{ steps.dataset-cache.outputs.cache-hit }}; offline verification: passed." >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.use_public_actions_cache }}" = "true" ]; then
            echo "Corpus verified. The public cache post-job step will save this cohort on a cache miss; check its completion log." >> "$GITHUB_STEP_SUMMARY"
            echo "The cache includes a RIGHTS_NOTICE.json with attribution and source license references." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Corpus assets were placed in temporary runner storage only." >> "$GITHUB_STEP_SUMMARY"
            echo "No audio was persisted in an Actions cache, uploaded as an artifact, committed, or published to Pages." >> "$GITHUB_STEP_SUMMARY"
          fi
